<svg width="200" height="160" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <defs>
    <radialGradient id="esca-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00ffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#00aaff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="angler-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161824"/>
      <stop offset="60%" stop-color="#0d0f18"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
  </defs>

  <!-- Glowing Esca (Lure) and Illicium (Spur) -->
  <path d="M125 70 C140 35 150 18 165 24 C175 28 172 45 168 55" stroke="#486078" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Light bulb -->
  <circle cx="168" cy="55" r="14" fill="url(#esca-glow)"/>
  <circle cx="168" cy="55" r="4.5" fill="#ffffff"/>

  <!-- Body -->
  <path d="M130 75 C120 62 95 60 70 65 C45 70 32 82 18 84 C10 74 6 70 2 68 C4 82 8 92 8 98 C4 104 2 112 0 120 C8 116 12 110 18 102 C30 106 45 118 70 124 C95 128 120 126 135 110 C140 100 142 85 130 75 Z" fill="url(#angler-skin)"/>

  <!-- Gaping Jaws & Needle Teeth -->
  <!-- Upper Jaw -->
  <path d="M130 75 C145 80 156 85 152 92" stroke="#25293d" stroke-width="2.5" fill="none"/>
  <!-- Lower Jaw (protruding forward and up) -->
  <path d="M115 122 C135 126 158 118 162 98" stroke="#25293d" stroke-width="2.5" fill="none"/>
  <path d="M130 75 L152 92 L140 98 L162 98 L135 115 Z" fill="#080a12"/>

  <!-- Needle Fangs -->
  <polygon points="135,78 137,88 139,79" fill="#cde8ff" opacity="0.9"/>
  <polygon points="142,82 144,93 146,84" fill="#cde8ff" opacity="0.9"/>
  <polygon points="148,87 151,96 152,89" fill="#cde8ff" opacity="0.9"/>
  <!-- Lower Fangs -->
  <polygon points="158,102 156,88 154,103" fill="#cde8ff" opacity="0.9"/>
  <polygon points="150,108 147,94 145,108" fill="#cde8ff" opacity="0.9"/>
  <polygon points="140,114 138,102 136,114" fill="#cde8ff" opacity="0.9"/>

  <!-- Tiny Eye -->
  <circle cx="120" cy="74" r="2.2" fill="#020305"/>
  <circle cx="120.5" cy="73.6" r="0.7" fill="#00e5ff"/>

  <!-- Pectoral Fin -->
  <path d="M90 98 C80 110 75 116 72 115 C74 108 82 100 88 96 Z" fill="#1b2030"/>

  <!-- Spiny Dorsal Finlets -->
  <path d="M60 66 L62 58 L65 67 L68 56 L72 68" stroke="#333c52" stroke-width="1.2" fill="none"/>
</svg>

