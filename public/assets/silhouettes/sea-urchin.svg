<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Sea Urchin Silhouette with sharp radiating needle spines -->
  <g fill="#000000" stroke="#000000" stroke-width="0.8">
    <!-- Central test body -->
    <circle cx="50" cy="50" r="16" />
    <!-- Radiating primary spines -->
    <polygon points="50,10 48,45 52,45" />
    <polygon points="50,90 48,55 52,55" />
    <polygon points="10,50 45,48 45,52" />
    <polygon points="90,50 55,48 55,52" />
    <!-- Diagonal primary spines -->
    <polygon points="22,22 46,44 49,41" />
    <polygon points="78,22 51,41 54,44" />
    <polygon points="22,78 46,56 49,59" />
    <polygon points="78,78 51,59 54,56" />
    <!-- Secondary intermediate spines -->
    <polygon points="35,14 47,46 50,44" />
    <polygon points="65,14 50,44 53,46" />
    <polygon points="35,86 47,54 50,56" />
    <polygon points="65,86 50,56 53,54" />
    <polygon points="14,35 44,47 46,50" />
    <polygon points="14,65 44,53 46,50" />
    <polygon points="86,35 56,47 54,50" />
    <polygon points="86,65 56,53 54,50" />
    <!-- Shorter dense tertiary spines -->
    <polygon points="42,20 48,48 50,46" />
    <polygon points="58,20 50,46 52,48" />
    <polygon points="42,80 48,52 50,54" />
    <polygon points="58,80 50,54 52,52" />
    <polygon points="20,42 48,48 46,50" />
    <polygon points="20,58 48,52 46,50" />
    <polygon points="80,42 52,48 54,50" />
    <polygon points="80,58 52,52 54,50" />
    <polygon points="28,28 47,46 49,44" />
    <polygon points="72,28 51,44 53,46" />
    <polygon points="28,72 47,54 49,56" />
    <polygon points="72,72 51,56 53,54" />
  </g>
</svg>

