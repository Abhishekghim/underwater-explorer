<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" fill="none">
  <defs>
    <linearGradient id="sail-main" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#eaf2f8" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#cde0ed" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="sail-jib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fcff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d5e6f2" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="hull-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#213a4e"/>
      <stop offset="60%" stop-color="#142634"/>
      <stop offset="100%" stop-color="#0a151d"/>
    </linearGradient>
  </defs>

  <!-- Rigging: Stays and Halyards -->
  <line x1="102" y1="18" x2="26" y2="128" stroke="#718fa6" stroke-width="0.8" opacity="0.6"/>
  <line x1="102" y1="18" x2="176" y2="128" stroke="#718fa6" stroke-width="0.8" opacity="0.6"/>
  <line x1="102" y1="65" x2="38" y2="128" stroke="#718fa6" stroke-width="0.7" opacity="0.4"/>
  <line x1="102" y1="18" x2="155" y2="122" stroke="#718fa6" stroke-width="0.8" opacity="0.5"/>

  <!-- Mast -->
  <rect x="100" y="16" width="3.2" height="112" rx="1" fill="#446178"/>
  <polygon points="102,15 88,19 102,23" fill="#ff6b35"/>

  <!-- Mainsail -->
  <path d="M104 22 C120 50 148 85 156 120 L104 122 Z" fill="url(#sail-main)"/>
  <line x1="104" y1="52" x2="126" y2="54" stroke="#a0bed6" stroke-width="0.8" opacity="0.6"/>
  <line x1="104" y1="78" x2="140" y2="81" stroke="#a0bed6" stroke-width="0.8" opacity="0.6"/>
  <line x1="104" y1="102" x2="150" y2="105" stroke="#a0bed6" stroke-width="0.8" opacity="0.6"/>
  <line x1="104" y1="123" x2="158" y2="123" stroke="#2c4558" stroke-width="2"/>

  <!-- Jib Sail -->
  <path d="M99 26 L32 124 C56 122 84 100 99 68 Z" fill="url(#sail-jib)"/>

  <!-- Cabin Trunk / Deckhouse -->
  <path d="M68 122 L72 113 L134 113 L138 122 Z" fill="#e2edf5"/>
  <rect x="80" y="115" width="10" height="4" rx="1" fill="#1b3345"/>
  <rect x="96" y="115" width="10" height="4" rx="1" fill="#1b3345"/>
  <rect x="112" y="115" width="10" height="4" rx="1" fill="#1b3345"/>

  <!-- Hull -->
  <path d="M22 124 C34 142 80 146 120 146 C155 146 176 138 184 124 C180 123 26 123 22 124 Z" fill="url(#hull-grad)"/>
  <path d="M25 127 C40 138 85 140 120 140 C150 140 170 134 180 127" stroke="#00d4ff" stroke-width="1.8" fill="none" opacity="0.85"/>
  <path d="M110 146 C105 155 95 158 92 152 L94 146 Z" fill="#09141c" opacity="0.7"/>
</svg>
