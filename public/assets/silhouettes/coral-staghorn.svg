<svg width="160" height="160" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="stag-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a3d4d"/>
      <stop offset="50%" stop-color="#3d6b8c"/>
      <stop offset="100%" stop-color="#64aee0"/>
