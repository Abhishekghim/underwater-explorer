  <path d="M42 78 C35 65 34 50 32 35" stroke="url(#stag-grad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M38 70 C44 55 52 45 54 30" stroke="url(#stag-grad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center Main Continuation -->
  <path d="M80 85 C78 60 76 45 74 20" stroke="url(#stag-grad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M78 65 C85 50 88 40 90 22" stroke="url(#stag-grad)" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Right Main Branch -->
  <path d="M80 110 C96 95 115 88 126 65" stroke="url(#stag-grad)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Sub-branches Right -->
  <path d="M102 90 C118 80 130 75 140 55" stroke="url(#stag-grad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 72 C126 58 128 44 130 28" stroke="url(#stag-grad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M126 65 C118 52 114 42 112 25" stroke="url(#stag-grad)" stroke-width="3.5" stroke-linecap="round"/>

