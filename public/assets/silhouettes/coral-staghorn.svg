  <circle cx="32" cy="33" r="3" fill="#8fe2ff"/>
  <circle cx="54" cy="28" r="3" fill="#8fe2ff"/>
  <circle cx="74" cy="18" r="3" fill="#8fe2ff"/>
  <circle cx="90" cy="20" r="3" fill="#8fe2ff"/>
  <circle cx="112" cy="23" r="3" fill="#8fe2ff"/>
  <circle cx="130" cy="26" r="3" fill="#8fe2ff"/>
  <circle cx="140" cy="53" r="3" fill="#8fe2ff"/>
</svg>

