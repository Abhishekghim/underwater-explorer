  <path d="M110 72 L128 66" stroke="#38ebd2" stroke-width="1.2" stroke-opacity="0.4"/>
  <path d="M110 88 L128 94" stroke="#38ebd2" stroke-width="1.2" stroke-opacity="0.4"/>

