<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80" fill="none">
  <!-- Bioluminescent Sea Anemone Cluster -->
  <defs>
    <radialGradient id="tip-glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tip-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep dark base stalk -->
  <path d="M38,80 C36,65 42,50 45,40 C48,50 54,65 52,80 Z" fill="#040b14" />
  <path d="M22,80 C20,68 28,52 32,45 C35,54 38,68 36,80 Z" fill="#061220" />
  <path d="M56,80 C54,68 62,54 66,46 C69,55 72,68 70,80 Z" fill="#061220" />

  <!-- Flowing tentacles with dark stalks -->
  <path d="M45,40 C38,30 25,24 16,18" stroke="#061220" stroke-width="2.4" stroke-linecap="round" />
  <path d="M45,40 C40,26 32,16 28,8" stroke="#061220" stroke-width="2.2" stroke-linecap="round" />
  <path d="M45,40 C44,24 42,14 42,6" stroke="#08182b" stroke-width="2.2" stroke-linecap="round" />
  <path d="M45,40 C48,24 54,14 58,6" stroke="#08182b" stroke-width="2.2" stroke-linecap="round" />
  <path d="M45,40 C52,26 64,18 70,10" stroke="#061220" stroke-width="2.2" stroke-linecap="round" />
  <path d="M45,40 C55,30 70,25 82,20" stroke="#061220" stroke-width="2.4" stroke-linecap="round" />

  <path d="M32,45 C24,35 15,30 8,26" stroke="#040b14" stroke-width="2.0" stroke-linecap="round" />
  <path d="M32,45 C30,30 25,20 20,14" stroke="#040b14" stroke-width="2.0" stroke-linecap="round" />
  <path d="M66,46 C74,36 82,30 92,28" stroke="#040b14" stroke-width="2.0" stroke-linecap="round" />
  <path d="M66,46 C72,32 78,22 84,16" stroke="#040b14" stroke-width="2.0" stroke-linecap="round" />

  <!-- Radiant bioluminescent glowing tips -->
  <circle cx="16" cy="18" r="4.5" fill="url(#tip-glow-cyan)" />
  <circle cx="28" cy="8" r="4.0" fill="url(#tip-glow-cyan)" />
  <circle cx="42" cy="6" r="4.5" fill="url(#tip-glow-cyan)" />
  <circle cx="58" cy="6" r="4.5" fill="url(#tip-glow-cyan)" />
  <circle cx="70" cy="10" r="4.0" fill="url(#tip-glow-cyan)" />
  <circle cx="82" cy="20" r="4.5" fill="url(#tip-glow-cyan)" />
  <circle cx="8" cy="26" r="3.5" fill="url(#tip-glow-blue)" />
  <circle cx="20" cy="14" r="3.5" fill="url(#tip-glow-blue)" />
  <circle cx="92" cy="28" r="3.5" fill="url(#tip-glow-blue)" />
  <circle cx="84" cy="16" r="3.5" fill="url(#tip-glow-blue)" />
</svg>

